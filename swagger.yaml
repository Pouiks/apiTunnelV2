openapi: 3.0.3
info:
  title: Mock API - Tunnel Reservation
  version: 2.0.0
  description: >
    API REST mock Node.js + Express pour simuler Snaplogic pendant le developpement.
    Architecture simplifiee : chaque GET /residences/:id retourne la fiche complete
    (typologies avec pricing + offre inlines, admin overlay) en un seul appel.
servers:
  - url: http://localhost:8081
    description: Local mock server
tags:
  - name: Residences
  - name: AdminTR
  - name: Reservations

paths:
  /residences:
    get:
      tags: [Residences]
      summary: GetAllResidences
      description: >
        Catalogue global de toutes les residences France (dezoom map).
        Aucun filtre ville — retourne les 7 residences mock.
        Chaque ligne porte un array minimal `typologies` avec pricing
        (longStay / midStay) et l'offre eventuelle inlinee par typologie.
      responses:
        "200":
          description: Catalogue complet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencesResponse"

  /cities/{cityAlias}/residences:
    get:
      tags: [Residences]
      summary: GetResidencesByCity
      description: >
        Residences d'une ville (filtre sur `cityAlias` ou `city`).
        Ex. `/cities/Paris/residences` retourne les 3 ECLA.
      parameters:
        - in: path
          name: cityAlias
          required: true
          schema:
            type: string
          description: Alias de ville (ex. Paris, Lyon, Toulouse).
      responses:
        "200":
          description: Residences de la ville
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityResidencesResponse"

  /cities/{cityAlias}/residences/{id}:
    get:
      tags: [Residences]
      summary: GetOneResidence
      description: >
        Fiche residence complete en un seul appel.
        Inclut `typologies` (pricing + amenities + offre eventuelle inlinee par typologie)
        et `configurationOptions` (grilles d’options unitaires communes a la residence).
        Le front charge et cache cette reponse pour alimenter tout le tunnel.
      parameters:
        - in: path
          name: cityAlias
          required: true
          schema:
            type: string
          description: Alias de ville (alimente les etats in-app).
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: UUID de la residence (ex. 19f2179b-7d14-f011-998a-6045bd1919a1).
      responses:
        "200":
          description: Fiche residence complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidenceDetail"
        "404":
          description: Residence introuvable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  cityAlias:
                    type: string
                  residenceId:
                    type: string

  /admin-tr:
    get:
      tags: [AdminTR]
      summary: GetInformationAdminTR
      description: >
        Configuration du tunnel de reservation geree par l'espace admin.
        Sans query param : retourne uniquement `modals` + `steps` (config globale, boot).
        Avec `?city=` : retourne en plus `residenceOverrides` — flags marketing et photos
        filtrees sur la ville demandee (match sur `city` ou `cityAlias`).
      parameters:
        - in: query
          name: city
          required: false
          schema:
            type: string
          description: >
            Alias de ville (ex. Paris, Lyon). Si fourni, la reponse inclut
            `residenceOverrides` avec les flags et photos des residences de cette ville.
      responses:
        "200":
          description: Configuration admin tunnel (+ overrides si city fourni)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTRResponse"

  /reservations:
    post:
      tags: [Reservations]
      summary: Creation opportunite ECCO
      description: |
        Simule la creation d'une opportunite dans le CRM ECCO.
        Le query param `scenario` selectionne le fichier mock a retourner.
        Defaut : `locataire_seul_majeur`.
      parameters:
        - in: query
          name: scenario
          required: false
          schema:
            type: string
            enum:
              - locataire_seul_majeur
              - locataire_seul_mineur_garant_physique
          description: Scenario de creation (defaut locataire_seul_majeur).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Opportunite creee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityCreationResponse"

components:
  schemas:
    Coordinates:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required: [lat, lng]

    TypologyListing:
      type: object
      description: >
        Apercu typologie sur le listing. Minimal : code typologie, pricing
        (longStay / midStay) et offre eventuelle inlinee.
      properties:
        typologyCode:
          type: string
          example: STUDIO
        pricing:
          $ref: "#/components/schemas/TypologyPricing"
        offer:
          $ref: "#/components/schemas/TypologyOffer"
          description: Presente uniquement si une offre s'applique a cette typologie.
      required:
        - typologyCode
        - pricing

    Floors:
      type: object
      properties:
        min:
          type: integer
        max:
          type: integer
      required: [min, max]

    ResidenceTag:
      type: object
      nullable: true
      properties:
        code:
          type: string
          enum: [POPULAR, SPECIAL_OFFER, NEW, LAST_UNITS]
        label:
          type: string
      required: [code, label]

    ResidencePhoto:
      type: object
      properties:
        url:
          type: string
          format: uri
        alt:
          type: string
        order:
          type: integer
        context:
          type: string
          enum: [HERO, COMMON, TYPOLOGY]
        typologyCode:
          type: string
          nullable: true
          description: Present uniquement si context = TYPOLOGY.
      required: [url, alt, order, context]

    ResidenceListItem:
      type: object
      properties:
        residenceId:
          type: string
        residenceCode:
          type: string
        residenceCodeAnalytic:
          type: string
          description: Code analytique / comptable (ERP) associe a la residence.
        name:
          type: string
        commercialName:
          type: string
          description: Nom commercial de la residence (peut differer du nom technique).
        brand:
          type: string
          enum: [ECLA, UXCO STUDENT]
        city:
          type: string
        cityAlias:
          type: string
          description: Alias de ville pour le front (ECLA => Paris).
        address:
          type: string
        postalCode:
          type: string
          description: Code postal (5 chiffres).
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        residenceAvailability:
          type: string
          description: >
            Disponibilite synthetique (ex. `AVAILABLE || FULL`, `PARTIAL || FULL`).
        availabilityStatus:
          type: string
          deprecated: true
          description: Remplace par `residenceAvailability` dans le mock listing.
        tag:
          $ref: "#/components/schemas/ResidenceTag"
          description: >
            Absent du fichier masterdata ; le serveur mock l’ajoute si un `flag`
            existe dans `GetAdminTR.residenceOverrides` pour cette residence.
        typologyTags:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResidenceTag"
          description: >
            Idem : injecte par merge admin (heritage du flag sur les typologies ciblees).
            Les codes typo viennent de la fiche detail (`GetOneResidenceById`).
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ResidencePhoto"
        typologies:
          type: array
          items:
            $ref: "#/components/schemas/TypologyListing"
      required:
        - residenceId
        - residenceCode
        - residenceCodeAnalytic
        - name
        - commercialName
        - brand
        - city
        - cityAlias
        - address
        - postalCode
        - coordinates
        - residenceAvailability
        - typologies

    ResidencesResponse:
      type: object
      description: Catalogue global (GET /residences) — toutes les residences France.
      properties:
        residences:
          type: array
          items:
            $ref: "#/components/schemas/ResidenceListItem"
      required: [residences]

    CityResidencesResponse:
      type: object
      description: Residences d'une ville (GET /cities/{cityAlias}/residences).
      properties:
        cityAlias:
          type: string
        residences:
          type: array
          items:
            $ref: "#/components/schemas/ResidenceListItem"
      required: [cityAlias, residences]

    CommonAmenity:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
      required: [code, label]

    AbonnementResidence:
      type: object
      description: >
        Service recurrent optionnel (ménage, parking, location TV, pack) affiche sur la fiche residence.
      properties:
        code:
          type: string
          description: Identifiant fonctionnel (ex. CLEANING_SERVICE, PARKING_SPACE).
        title:
          type: string
        description:
          type: string
        pricePerMonth:
          type: number
        currency:
          type: string
          example: EUR
        billingPeriod:
          type: string
          description: Periode de facturation (ex. month).
        icon:
          type: string
          description: Cle d’icone UI (ex. cleaning, parking, tv, gift).
      required:
        - code
        - title
        - description
        - pricePerMonth
        - currency
        - billingPeriod
        - icon

    TypologyDetail:
      type: object
      description: >
        Typologie sur la fiche residence : tarification, amenities incluses
        et offre eventuelle inlinee. Les options configurables (etage, surface, etc.)
        sont dans `configurationOptions` au niveau residence et s'additionnent
        au `baseRent` (ou `withOfferAmount`).
      properties:
        typologyCode:
          type: string
        label:
          type: string
        surface:
          type: number
          description: Surface indicative (m2) pour les typologies a logement entier.
        minimumSurface:
          type: number
          description: Surface minimum (m2) pour les typologies en colocation.
        pricing:
          $ref: "#/components/schemas/TypologyPricing"
        amenities:
          type: array
          items:
            $ref: "#/components/schemas/Amenity"
        offer:
          $ref: "#/components/schemas/TypologyOffer"
          description: Presente uniquement si une offre s'applique a cette typologie.
      required:
        - typologyCode
        - label
        - pricing
        - amenities

    StayPricing:
      type: object
      description: >
        Tarification pour une duree donnee : loyer de base + variante avec offre,
        plus depot de garantie et frais de dossier (chacun avec leur variante avec offre).
        Les variantes `with*` valent la version remisee si une offre cible le champ
        correspondant, sinon elles peuvent etre vides ("").
      properties:
        baseRent:
          type: number
          description: Loyer mensuel hors options et hors offre.
        withOfferAmount:
          type: number
          description: >
            Loyer mensuel apres application de l'offre attachee a la typologie
            (egal a `baseRent` si aucune offre ne cible BASE_RENT).
        securityDeposit:
          oneOf:
            - type: number
            - type: string
          description: Depot de garantie. Vide ("") si non applicable a cette duree.
        securityDepositWithOffer:
          oneOf:
            - type: number
            - type: string
          description: Depot de garantie apres offre. Vide ("") si non applicable.
        applicationFees:
          oneOf:
            - type: number
            - type: string
          description: Frais de dossier. Vide ("") si non applicable a cette duree.
        applicationFeesWithOffer:
          oneOf:
            - type: number
            - type: string
          description: Frais de dossier apres offre. Vide ("") si non applicable.
      required:
        - baseRent
        - withOfferAmount
        - securityDeposit
        - securityDepositWithOffer
        - applicationFees
        - applicationFeesWithOffer

    TypologyPricing:
      type: object
      description: >
        Tarification typologie par duree de sejour. Le client peut prendre
        `longStay` ou `midStay` selon son besoin ; chaque duree expose un
        `baseRent` et un `withOfferAmount` (loyer apres remise eventuelle).
        Les options configurables (`configurationOptions`) s'additionnent ensuite
        au loyer choisi.
      properties:
        longStay:
          $ref: "#/components/schemas/StayPricing"
        midStay:
          $ref: "#/components/schemas/StayPricing"
      required: [longStay, midStay]

    TypologyOffer:
      type: object
      description: >
        Offre inlinee dans une typologie. La presence de cette cle signale qu'une offre
        s'applique ; l'effet sur le loyer est deja reflete dans `pricing.*.withOfferAmount`
        lorsque `discount.target` vaut `BASE_RENT`.
      properties:
        bookingDate:
          type: string
          format: date
          description: Date de reference du referentiel offres au moment du snapshot.
        conditions:
          $ref: "#/components/schemas/OfferConditions"
        discount:
          $ref: "#/components/schemas/OfferDiscount"
      required: [bookingDate, conditions, discount]

    Amenity:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
      required: [code, label]

    OptionVariant:
      type: object
      properties:
        variantCode:
          type: string
          description: Code variant qualifiant (ex. FLOOR_LOW, SURFACE_COMFORTABLE).
        label:
          type: string
        description:
          type: string
          nullable: true
        amount:
          type: number
          description: Montant additionnel mensuel par rapport au baseRent (0 pour le variant par defaut).
        productCode:
          type: string
          description: Code du produit parent (= `groupCode` du groupe d'options).
        accountingDestinationCode:
          type: string
          description: Destination comptable, presente uniquement pour les variants payants.
      required: [variantCode, label, amount, productCode]

    OptionGroup:
      type: object
      description: >
        Groupe d’options configurables ; pas d’icone en masterdata (mapping UI cote client ou referentiel separe).
      properties:
        groupCode:
          type: string
        label:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/OptionVariant"
      required: [groupCode, label, variants]

    ResidenceDetail:
      type: object
      description: >
        Fiche complete residence : infos generales, typologies (pricing + amenities
        + offre eventuelle inlinee) et options unitaires communes (`configurationOptions`).
        Un seul appel pour le tunnel.
      properties:
        residenceId:
          type: string
        residenceCode:
          type: string
        name:
          type: string
        commercialName:
          type: string
        brand:
          type: string
          enum: [ECLA, UXCO STUDENT]
        city:
          type: string
        cityAlias:
          type: string
        address:
          type: string
        telephone:
          type: string
          description: Numero de contact residence (affichage / click-to-call).
        email:
          type: string
          format: email
          description: Adresse e-mail de contact residence.
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        availabilityStatus:
          type: string
        description:
          type: string
        tag:
          $ref: "#/components/schemas/ResidenceTag"
          description: >
            Absent du fichier masterdata ; le serveur mock l’ajoute si un `flag`
            existe dans `GetAdminTR.residenceOverrides` pour cette residence.
        typologyTags:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResidenceTag"
          description: >
            Idem : injecte par merge admin (heritage du flag sur les typologies ciblees).
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ResidencePhoto"
        commonAmenities:
          type: array
          items:
            $ref: "#/components/schemas/CommonAmenity"
        abonnements:
          type: array
          items:
            $ref: "#/components/schemas/AbonnementResidence"
        typologies:
          type: array
          items:
            $ref: "#/components/schemas/TypologyDetail"
        floors:
          $ref: "#/components/schemas/Floors"
        configurationOptions:
          type: array
          description: >
            Options configurables communes a la residence (etage, surface, literie, clim, balcon, etc.).
            Les montants sont identiques quel que soit le type de logement selectionne et
            s'additionnent au `baseRent` (ou `withOfferAmount`) de la typologie choisie.
            Le groupe `PREMIUM` n’est present que pour les residences qui le proposent (ex. Noisy-le-Grand).
          items:
            $ref: "#/components/schemas/OptionGroup"
      required:
        - residenceId
        - residenceCode
        - name
        - commercialName
        - brand
        - city
        - cityAlias
        - address
        - telephone
        - email
        - coordinates
        - availabilityStatus
        - photos
        - commonAmenities
        - abonnements
        - typologies
        - floors
        - configurationOptions

    OfferConditions:
      type: object
      properties:
        bookingDeadline:
          type: string
          format: date
          nullable: true
        startDateFrom:
          type: string
          format: date
          nullable: true
        startDateTo:
          type: string
          format: date
          nullable: true
        minDurationMonths:
          type: integer
          nullable: true
      required: [bookingDeadline, startDateFrom, startDateTo, minDurationMonths]

    OfferDiscount:
      type: object
      properties:
        target:
          type: string
          enum: [BASE_RENT, APP_FEE, SECURITY_DEPOSIT]
          description: Sur quoi porte la reduction.
        reductionType:
          type: string
          enum: [FIXED_AMOUNT, PERCENTAGE]
        amount:
          type: number
          description: Valeur negative (ex. -50 pour -50€).
        billingTiming:
          type: string
          enum: [ONE_SHOT, RECURRING]
        recurrenceMonths:
          type: integer
          nullable: true
          description: Nombre de mois de recurrence si `billingTiming = RECURRING`, sinon null.
      required: [target, reductionType, amount, billingTiming]

    ModalInfoBox:
      type: object
      properties:
        icon:
          type: string
        content:
          type: string
      required: [icon, content]

    ModalSection:
      type: object
      properties:
        icon:
          type: string
        title:
          type: string
        description:
          type: string
          description: Peut contenir du HTML inline (strong, em).
        listHeading:
          type: string
        listItems:
          type: array
          items:
            type: string
        infoBox:
          $ref: "#/components/schemas/ModalInfoBox"
      required: [icon, title, description, listItems]

    ModalLocalized:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ModalSection"
      required: [title, subtitle, sections]

    Modal:
      type: object
      properties:
        step:
          type: integer
        trigger:
          type: string
          description: Evenement declencheur (ex. EXPRESS_BOOKING_CLICK, PAYMENT_STEP_ENTER).
        fr:
          $ref: "#/components/schemas/ModalLocalized"
        en:
          $ref: "#/components/schemas/ModalLocalized"
      required: [step, trigger, fr, en]

    TunnelStepLocalized:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
      required: [title, description]

    TunnelStep:
      type: object
      properties:
        stepCode:
          type: string
        order:
          type: integer
        fr:
          $ref: "#/components/schemas/TunnelStepLocalized"
        en:
          $ref: "#/components/schemas/TunnelStepLocalized"
      required: [stepCode, order, fr, en]

    AdminCommonAmenity:
      type: object
      description: Equipement commun residence (FR + EN) pour la surcouche admin.
      properties:
        code:
          type: string
        label:
          type: string
          description: Libelle affiche (FR).
        labelEn:
          type: string
          description: Libelle anglais.
      required: [code, label, labelEn]

    ResidenceOverrideFlag:
      type: object
      description: >
        Flag marketing attribue via l'admin. Heritage parent-enfant :
        si `typologies` est vide ou absent, toutes les typologies de la residence heritent du flag.
        Si `typologies` est renseigne, seules ces typologies le portent.
      properties:
        code:
          type: string
          enum: [POPULAR, SPECIAL_OFFER, NEW, LAST_UNITS]
        label:
          type: string
        labelEn:
          type: string
          description: Libelle du flag en anglais (tunnel bilingue).
        typologies:
          type: array
          items:
            type: string
          description: >
            Codes typo cibles (ex. STUDIO, T2). Vide = toutes les typologies heritent.
      required: [code, label]

    ResidenceOverride:
      type: object
      description: >
        Surcouche admin pour une residence : texte marketing, equipements communs,
        flag marketing et photos. Les photos remplacent integralement celles de la masterdata.
      properties:
        residenceId:
          type: string
        city:
          type: string
        cityAlias:
          type: string
        description:
          type: string
          description: Texte descriptif marketing (tunnel / fiche enrichie).
        commonAmenities:
          type: array
          items:
            $ref: "#/components/schemas/AdminCommonAmenity"
          description: Equipements communs avec libelles FR et EN.
        flag:
          $ref: "#/components/schemas/ResidenceOverrideFlag"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ResidencePhoto"
      required: [residenceId, city, cityAlias]

    AdminTRResponse:
      type: object
      description: >
        Configuration du tunnel de reservation.
        Modals bilingues par step+trigger, steps informatifs.
        `residenceOverrides` n'est present que si le query param `city` est fourni.
      properties:
        modals:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Modal"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TunnelStep"
        residenceOverrides:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResidenceOverride"
          description: >
            Cle = residenceId (UUID). Present uniquement si query param `city` fourni.
            Contient les flags et photos admin des residences de la ville demandee.
      required: [modals, steps]

    PicklistValue:
      type: object
      properties:
        value:
          type: integer
        label:
          type: string

    Contact:
      type: object
      description: |
        Contact CRM. Le tableau `contacts[]` est dynamique : seuls les contacts
        effectivement renseignes sont inclus (pas de slots vides avec null).
        Le champ `uxcRole` porte la picklist ECCO (uxcRole) qui determine le role
        du contact dans l'opportunite. Valeurs disponibles :
          944800000 Locataire (1er locataire)
          944800005 Co-locataire (2e locataire, bail multi)
          944800003 Representant Legal Locataire (locataire 1 mineur)
          944800011 Representant Legal 2 Locataire (locataire 2 mineur)
        Les garants (physique/moral) ne sont pas des contacts dans le payload —
        ils sont geres via typeDeGarant sur l opportunity.
        Tous les champs ci-dessous sont obligatoires sur chaque contact (pas de null).
      properties:
        uxcRole:
          $ref: "#/components/schemas/PicklistValue"
          description: >
            Role ECCO du contact. Valeurs : 944800000 Locataire,
            944800005 Co-locataire, 944800003 Representant Legal Locataire,
            944800011 Representant Legal 2 Locataire.
        prenom:
          type: string
        nom:
          type: string
        email:
          type: string
          format: email
        telephone:
          type: string
        dateDeNaissance:
          type: string
          format: date
        lieuDeNaissance:
          type: string
        nationalite:
          type: string
          description: GUID pays (Dataverse) ou code pays selon integration.
        pays:
          type: string
          description: GUID pays (Dataverse) ou code pays selon integration.
        mineur:
          $ref: "#/components/schemas/PicklistValue"
        profilLocataire:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PicklistValue"
          description: >
            Profil locataire (picklist aps_profillocataire). Absent pour les contacts
            `uxcRole` Representant Legal Locataire (944800003) ou
            Representant Legal 2 Locataire (944800011) — ce profil n'est pas collecte.
        langueDeCommunication:
          $ref: "#/components/schemas/PicklistValue"
        adresse:
          type: string
        codePostal:
          type: string
        ville:
          type: string
        rgpdConsetement:
          type: string
          enum: ["true", "false"]
          description: >
            Consentement RGPD (cle alignee ECCO, orthographe historique `consetement`).
            `true` uniquement pour le premier locataire (`uxcRole` Locataire 944800000).
        rgpdConsentement:
          type: string
          enum: ["true", "false"]
          description: >
            Second flag consentement. `true` pour locataire 944800000 ; `false` pour
            co-locataire (944800005) et representants legaux (944800003, 944800011).
      required:
        - uxcRole
        - prenom
        - nom
        - email
        - telephone
        - dateDeNaissance
        - lieuDeNaissance
        - nationalite
        - pays
        - mineur
        - langueDeCommunication
        - adresse
        - codePostal
        - ville
        - rgpdConsetement
        - rgpdConsentement

    Produit:
      type: object
      description: Logement selectionne par le client (reference produit ECCO).
      properties:
        productId:
          type: string
          description: GUID du produit dans ECCO.
        productName:
          type: string
          description: Libelle du logement (ex. Studio 20m² - 3ème étage).
        quantity:
          type: integer
          example: 1
      required: [productId, productName, quantity]

    OffreItem:
      type: object
      description: >
        Entree dans le tableau `offres` de l'opportunity.
        Le champ `type` discrimine l'offre standard (`offre`) du code promo (`code_promo`).
        Les champs `codePromo` et `etat` sont toujours presents :
        null pour une offre standard, renseignes pour un code promo.
      properties:
        type:
          type: string
          enum: [offre, code_promo]
          description: Discriminant — offre automatique ou code promo saisi par le client.
        offreId:
          type: string
          example: OFFER_SUMMER_2026
        nom:
          type: string
        montant:
          type: number
          description: Valeur de la reduction (ex. 50.00).
        typeReduction:
          type: string
          enum: [EUR, PERCENT]
          description: EUR = montant fixe, PERCENT = pourcentage.
        cible:
          type: string
          enum: [loyer, frais_de_dossier, depot_de_garantie]
          description: Sur quoi porte la reduction.
        recurrence:
          type: string
          enum: [unique, mensuelle]
        recurrenceMois:
          type: integer
          nullable: true
          description: Nombre de mois si mensuelle. Null si unique.
        dateDebut:
          type: string
          format: date
        dateFin:
          type: string
          format: date
        codePromo:
          type: string
          nullable: true
          description: Code saisi par le client. Null si type=offre.
          example: FDD50
        etat:
          type: string
          nullable: true
          enum: [valide, invalide]
          description: Etat de validation du code promo. Null si type=offre.
      required: [type, offreId, nom, montant, typeReduction, cible, recurrence, dateDebut, dateFin, codePromo, etat]

    OpportunityDetail:
      type: object
      description: |
        Payload exhaustif a taille fixe. Tous les champs sont toujours presents.
        Les champs non applicables valent `null`.
      properties:
        typeDopportunite:
          $ref: "#/components/schemas/PicklistValue"
        source:
          $ref: "#/components/schemas/PicklistValue"
        marqueDeLaResidence:
          $ref: "#/components/schemas/PicklistValue"
        residenceId:
          type: string
          format: uuid
        residenceName:
          type: string
        typeDeLot:
          type: string
        typeDeBail:
          $ref: "#/components/schemas/PicklistValue"
        typeDeLogementSouhaitee:
          $ref: "#/components/schemas/PicklistValue"
        contractType:
          $ref: "#/components/schemas/PicklistValue"
        salesChannel:
          $ref: "#/components/schemas/PicklistValue"
        dateArrivee:
          type: string
          format: date
        dateDepart:
          type: string
          format: date
        statutDeLopportunite:
          $ref: "#/components/schemas/PicklistValue"
        necessiteDeGarant:
          $ref: "#/components/schemas/PicklistValue"
          description: >
            Indique si un garant est requis. Les equipes sales gerent
            le detail garant apres la pre-reservation.
        typeDeGarant:
          $ref: "#/components/schemas/PicklistValue"
          description: Physique ou Moral. Suffit pour la pre-reservation.
        depotDeGarantie:
          type: number
        fraisDeDossiers:
          type: number
        montant1erPaiement:
          type: number
        parkingSeul:
          $ref: "#/components/schemas/PicklistValue"
        libelleopportunite:
          type: string
        options:
          type: array
          items:
            type: string
          description: Options selectionnees par le client (ex. Balcon, Climatisation). ECCO gere les prix.
        abonnements:
          type: array
          items:
            type: string
          description: Abonnements selectionnes par le client (ex. Le pack, TV, Kit Linge). ECCO gere les prix.
        sourceUtmCampaign:
          type: string
          description: Parametre UTM campaign (tracking acquisition).
        sourceUtmGclid:
          type: string
          description: Google Click ID (si applicable).
        sourceUtmMedium:
          type: string
          example: cpc
        sourceUtmSource:
          type: string
          example: google
        sourceUtmTerm:
          type: string
        sourceUtmContent:
          type: string
        offres:
          type: array
          description: >
            Offres et codes promo appliques par le client. Tableau vide si aucune offre.
            Chaque entree a un `type` (offre | code_promo) pour discriminer.
          items:
            $ref: "#/components/schemas/OffreItem"

    OpportunityScenarioPayload:
      type: object
      description: |
        Payload de creation opportunite ECCO.
        `contacts[]` est dynamique : seuls les contacts renseignes sont inclus.
        Chaque contact porte un `uxcRole` (picklist ECCO) qui determine son role.
        Les garants ne sont pas des contacts — ils sont captures via
        `necessiteDeGarant` et `typeDeGarant` sur l opportunity.
      properties:
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Contact"
        opportunity:
          $ref: "#/components/schemas/OpportunityDetail"
      required: [contacts, opportunity]

    OpportunityCreationResponse:
      type: object
      properties:
        status:
          type: string
          example: ACCEPTED
        opportunityId:
          type: string
          example: OPP-M1A2B3C4
        scenario:
          type: string
          example: locataire_seul_majeur
        availableScenarios:
          type: array
          items:
            type: string
        submittedPayload:
          $ref: "#/components/schemas/OpportunityScenarioPayload"
        confirmation:
          $ref: "#/components/schemas/ReservationConfirmation"
      required: [status, opportunityId, scenario, availableScenarios, submittedPayload, confirmation]

    ReservationConfirmation:
      type: object
      properties:
        status:
          type: string
          example: ACCEPTED
        quoteRequestId:
          type: string
          example: BQ-2026-000123
        eccoOpportunityId:
          type: string
          example: OPP-2026-XXXXX
        message:
          type: string
          example: Reservation creee avec succes dans ECCO.
